# How AnSci applies this scheme today — consumer-side record, NOT scheme
# content. Migrated so the knowledge and its current use sit in one place.
application_notes:
  - "Climb stops (AnSci src/ansci/classify.ts, Slice A, built 2026-11-18): ten WordNet synsets stop the hypernym climb at a class — bird to feathered; mammal to furred; insect, fish, snake, lizard to scaled; turtle, crustacean, bivalve, gastropod to shelled. Class candidates are priced flat at the 0.80 cap with no per-hop decay (owner ruling 2a, 2026-11-18)."
  - "Exclusion (classify.ts): the human subtree is carved out of the mammal stop — the Yueling commentary's own placement puts the human in the naked class (人土屬, 其類為倮); the naked class's type member cannot file as furred. No naked-class stop is asserted by that slice."
  - "Exclusion (classify.ts): the cetacean subtree is carved out of the mammal stop — the whale kind is unsettled between the two systems (WordNet files it inside mammal; the tradition's habitat-and-form reckoning stands it with the great fish). Its assignment is a ruling for another day."
  - "Mollusk shape (owner ruling 5a, 2026-11-18): no mollusk stop — the mollusk subtree also holds the cephalopods, which no leg of this scheme names; the stops sit at bivalve and gastropod. Chitons and scaphopods stay unreached by that route."
  - "Unreached by the WordNet route, each named as a located gap in the Slice A report (docs/ansci/slice-a-report.md): frog, toad, spider, scorpion, earthworm, leech, coral, jellyfish (no stop reaches their kinds), octopus and squid (cephalopods, by the mollusk shape above), centipede, yak (mammal at 8 hops, beyond the 6-hop bound), and the category word animal itself. Unreached by a consumer route is a statement about the route, not about scheme membership."
  - "Known limit, recorded at registration: the five-livestock assertion row outranks this class rule where both apply. Cattle, sheep and dog are furred, so the rule predicts Metal for all three, against attested Earth, Fire and Metal respectively (AnSci record, Part E)."
  - "Variant graph: Huainanzi, Shize writes the naked class 蠃 and gives the classes through their chiefs in its own centre block — a parallel voice, to be registered as its own scheme when the Huainanzi material migrates, not merged into this one."
