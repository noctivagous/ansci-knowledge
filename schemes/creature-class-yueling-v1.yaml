    attributed_to: "Zheng Xuan (鄭氏), transmitted in the Yueling commentary tradition (Chen Hao's note): 《鄭氏》以為虎豹之屬 — Zheng held the naked class to include tigers and leopards (thin-furred, as Part E recorded)"
